<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1e293b"/>

  <!-- Gradient Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#grad)"/>

  <!-- BBPad Text -->
  <text x="256" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white">BB</text>
  <text x="256" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white">Pad</text>

  <!-- Code brackets -->
  <text x="256" y="320" font-family="monospace" font-size="48" text-anchor="middle" fill="#60a5fa">{}</text>

  <!-- Clojure symbol -->
  <circle cx="256" cy="380" r="15" fill="#f59e0b"/>
  <text x="256" y="388" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle" fill="white">λ</text>
</svg>